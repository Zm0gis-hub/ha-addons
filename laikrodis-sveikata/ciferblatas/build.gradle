plugins {
    id "com.android.application"
}

// Ciferblatas „Watch Face Format“ formatu: tik XML ir paveikslėliai, be programos kodo.
android {
    namespace "lt.namai.sveikata.ciferblatas"
    compileSdk 35

    defaultConfig {
        applicationId "lt.namai.sveikata.ciferblatas"
        minSdk 33
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        pastovus {
            storeFile file("../sveikata.keystore")
            storePassword "sveikata"
            keyAlias "sveikata"
            keyPassword "sveikata"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.pastovus
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
