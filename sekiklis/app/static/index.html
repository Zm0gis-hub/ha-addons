<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171412" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<title>Sekiklis</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<header id="top">
  <h1>🎮 Sekiklis</h1>
  <button id="btn-check" class="icon-btn" aria-label="Tikrinti dabar" title="Tikrinti viską dabar">⟳</button>
  <button id="btn-settings" class="icon-btn" aria-label="Nustatymai" title="Nustatymai">⚙️</button>
</header>
<main id="view">
  <section id="health"></section>
  <form id="add" class="card add">
    <input id="add-url" type="url" placeholder="Įklijuok prekės nuorodą…" autocomplete="off" required>
    <button class="btn primary">Sekti</button>
  </form>
  <section id="list"></section>
  <p id="foot" class="muted small center"></p>
</main>
<div id="sheet-bg" hidden></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<script src="app.js?v=1"></script>
</body>
</html>
