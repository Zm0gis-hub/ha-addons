name: Laikrodžio programėlė „Pirkiniai“

on:
  push:
    paths:
      - "laikrodis/**"
      - ".github/workflows/laikrodis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Surinkti APK
        working-directory: laikrodis
        run: |
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/pirkiniai-laikrodis.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: pirkiniai-laikrodis
          path: pirkiniai-laikrodis.apk

      - name: Paskelbti atsisiuntimui
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view laikrodis >/dev/null 2>&1; then
            gh release upload laikrodis pirkiniai-laikrodis.apk --clobber
          else
            gh release create laikrodis pirkiniai-laikrodis.apk \
              --title "Pirkiniai laikrodžiui (Wear OS)" \
              --notes "Laikrodžio programėlė pirkinių sąrašui iš priedo Receptai. Diegimo instrukcija – Receptai priedo skirtuke Dokumentacija."
          fi
