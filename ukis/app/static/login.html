<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#efede9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191715" media="(prefers-color-scheme: dark)">
<title>Ūkis – prisijungimas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body style="padding:0">
<main style="max-width:360px;margin:15vh auto 0;padding:20px">
  <div class="center"><img src="icon-192.png" alt="" width="96" height="96" style="border-radius:24px"></div>
  <h1 class="center" style="font-size:24px;margin:8px 0 20px">Ūkis</h1>
  <form id="f" class="card pad stack">
    <label class="field"><span>PIN kodas</span><input type="password" inputmode="numeric" id="pin" autofocus required></label>
    <button class="btn primary block">Prisijungti</button>
    <p id="err" class="center" style="color:var(--danger);margin:0" hidden>Neteisingas PIN</p>
  </form>
  <p class="muted small center" style="margin-top:14px">Šiame telefone PIN reikės įvesti tik vieną kartą.</p>
</main>
<script>
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pin: document.getElementById('pin').value }) });
  if (r.ok) location.href = './'; else document.getElementById('err').hidden = false;
};
</script>
</body>
</html>
